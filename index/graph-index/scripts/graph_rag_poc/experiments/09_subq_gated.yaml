name: 09_subq_gated
description: |
  A-2 게이팅 v2. 08_subq(ungated)가 집계·종합형은 돕고(sense+0.067) 나열형은 망친(fanout−0.12)
  결과 → 분해를 '집계·종합형'에만 발동하는 gated decompose 프롬프트로 교체.
  synthesizer는 동일(subq_decompose), decompose_prompt만 subq_decompose_gated.
  목표: 나열형 손해 제거 + 집계형 이득 유지 → net 플러스. Tier-1 분산 Q5·6·8 + 관계 노림.
techniques: [A-2-gated]
gen_temperature: 0

corpus: data/chunks/scaled_1000.json

qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json

categories: null

tracks:
  lazy_qt:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

  subq_gated:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: subq_decompose
      relevance_prompt: relevance_strict
      decompose_prompt: subq_decompose_gated
      claim_prompt: claim_strict
      reduce_prompt: system_baseline

output: results/09_subq_gated
