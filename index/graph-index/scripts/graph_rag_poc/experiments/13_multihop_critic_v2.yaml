name: 13_multihop_critic_v2
description: |
  A-3 critic v2 (보수화). v1이 Q15(영향력 나열형)를 과잉교정(0.8→0.7)한 것 수정 →
  critic_relation_v2는 '나열형 연결/영향력 질문' 교정 제외, '두 대상 직접관계?' 트랩만 교정.
  목표: Q28 환각 유지(1.0) + Q15 회수(0.8) → Tier-1 6/8.
  3트랙: lazy_qt / multihop(R-5) / multihop+critic_v2.
techniques: [R-5, A-3-v2]
gen_temperature: 0

corpus: data/chunks/scaled_1000.json

qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json

categories: null

tracks:
  lazy_qt:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

  multihop:
    retriever: {type: multihop, top_k: 20, hop2_k: 5}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

  multihop_critic_v2:
    retriever: {type: multihop, top_k: 20, hop2_k: 5}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
        - {type: verify, prompt: critic_relation_v2}

output: results/13_multihop_critic_v2
