name: 30_aug_i7
description: |
  보강 relation+sensemaking 19문 신호확정 (graphrag 약점유형). baseline vs 보조.
techniques: [graphrag-router]
gen_temperature: 0

corpus: data/chunks/scaled_1000_i7full.json

qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_graphtypes.json

categories: [relation_reasoning, sensemaking]

tracks:
  lazy_qt:
    retriever: {type: vector_topk, top_k: 20, max_index: 200000}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
  i7_route:
    retriever: {type: i7_route, top_k: 20, route_topn: 5, include_desc: false}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
  i7_gen:
    retriever: {type: i7_route, top_k: 20, route_topn: 5, include_desc: true}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

output: results/30_aug_i7
