name: 07_egroup
description: |
  기법 I-3(Entity/Relation KV Store) 쿼리시점 구현 = 엔티티별 청크 그룹핑.
  relevant 청크를 질문 타깃 엔티티별로 묶어 claim 추출에 전달(claim 직전 entity_group stage 1개만 추가).
  가설: Tier-1 분산통합 Q5·6·8 잠식 — Full의 '엔티티 디스크립션 pre-aggregate' 효과를 그래프 인덱스 없이 모사.
  baseline lazy_qt와 1:1 A/B (retriever·코퍼스 동일, stage 1개 차이로 효과 격리).
techniques: [I-3qt]

corpus: data/chunks/scaled_1000.json

qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json

categories: null

tracks:
  lazy_qt:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

  lazy_qt_egroup:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: entity_group, prompt: entity_extract}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

output: results/07_egroup
