name: 42_mhg_critic
description: |
  step5 조합 — graph + R-5(multihop) + A-3 Critic. R-5 검색이득(relation/dist/sense) + critic의 trap 해결 시너지 확인.
  4트랙(50문, temp=0): vector / vplus / vplus_critic(채택본) / mhg_critic(조합). 관건: 조합이 채택본(vplus_critic)을 넘나.
techniques: [graph_rag, R-5, A-3]
gen_temperature: 0

corpus: data/chunks/scaled_1000.json

qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json
  - data/qa/golden_qa_graphtypes.json

categories: null
exclude_ids: [11, 46]

tracks:
  vector:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
  vplus:
    retriever: {type: vector_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
  vplus_critic:
    retriever: {type: vector_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
        - {type: critic_gated, prompt: critic_relation}
  mhg_critic:
    retriever: {type: multihop_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json, hop2_k: 5}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
        - {type: critic_gated, prompt: critic_relation}

output: results/42_mhg_critic
