name: 12_multihop_critic
description: |
  A-3 Self-Reflection/Critic을 채택기법 R-5(multihop) 위에 추가. 마지막 실질 갭 Q28(환각 distractor) 공략.
  critic = verify stage + critic_relation 프롬프트(보수적, 관계날조만 교정, R-5 관계win 보존).
  3트랙으로 critic 한계효과 격리: lazy_qt(원baseline) / multihop(R-5) / multihop+critic.
  핵심 확인: (1) Q28 환각 개선? (2) R-5의 Q15·16·6·8 win 보존? (3) 다른 카테고리 과잉교정 없나?
techniques: [R-5, A-3]
gen_temperature: 0

corpus: data/chunks/scaled_1000.json

qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json

categories: null

tracks:
  lazy_qt:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

  multihop:
    retriever: {type: multihop, top_k: 20, hop2_k: 5}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

  multihop_critic:
    retriever: {type: multihop, top_k: 20, hop2_k: 5}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
        - {type: verify, prompt: critic_relation}

output: results/12_multihop_critic
