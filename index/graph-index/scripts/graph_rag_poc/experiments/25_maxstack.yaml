name: 25_maxstack
description: |
  성과·중립 기법 전부 스택 시너지 검증. 깨끗이 스택 가능한 조합:
  R-5(multihop 검색) + R-9(answer_type_filter) + A-1/A-3(critic_gated).
  3트랙: baseline / R5_only / max_stack. 가설: ~R-5+critic 수렴 예상, 시너지 여부 + 마이너스 아닌지 확인.
techniques: [R-5, R-9, A-1, A-3]
gen_temperature: 0
corpus: data/chunks/scaled_1000.json
qa: [data/qa/golden_qa.json, data/qa/golden_qa_fanout.json, data/qa/golden_qa_halluc.json]
categories: null
tracks:
  baseline:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
  R5_only:
    retriever: {type: multihop, top_k: 20, hop2_k: 5}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
  max_stack:
    retriever: {type: multihop, top_k: 20, hop2_k: 5}
    synthesizer:
      type: pipeline
      stages:
        - {type: answer_type_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
        - {type: critic_gated, prompt: critic_relation}
output: results/25_maxstack
