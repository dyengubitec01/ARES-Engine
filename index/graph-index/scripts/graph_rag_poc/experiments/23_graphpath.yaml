name: 23_graphpath
description: |
  기법 R-4 (Topology/Path Discovery). GLiNER2 그래프에서 질문 엔티티쌍 최단경로 위 엔티티 청크 회수.
  baseline lazy_qt(vector_topk) vs graph_path. 예상: 그래프-회수 축(R-8·exp04 중립)이라 중립. 데이터 완성용.
techniques: [R-4]
gen_temperature: 0
corpus: data/chunks/scaled_1000.json
qa: [data/qa/golden_qa.json, data/qa/golden_qa_fanout.json, data/qa/golden_qa_halluc.json]
categories: null
tracks:
  lazy_qt:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
  graph_path:
    retriever: {type: graph_path, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json, top_entities: 6, max_path_len: 3}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
output: results/23_graphpath
