name: 38_vplus_rerank
description: |
  step5 기법② R-7 Rerank — graph_rag(run35 설정) 위에 rerank 얹어 합친 풀 노이즈 정리.
  rerank = 합친 청크를 LLM이 관련도순 재정렬 → 상위 top_n=15만. 희석 제거로 net+ 시도(relation 안 깎고).
  3트랙(50문, temp=0): vector / vplus(graph baseline) / vplus+rerank.
techniques: [graph_rag, R-7]
gen_temperature: 0

corpus: data/chunks/scaled_1000.json

qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json
  - data/qa/golden_qa_graphtypes.json

categories: null
exclude_ids: [11, 46]

tracks:
  vector:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
  vplus:
    retriever: {type: vector_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
  vplus_rerank:
    retriever: {type: vector_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer:
      type: pipeline
      stages:
        - {type: rerank, prompt: rerank_relevance, top_n: 15}
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

output: results/38_vplus_rerank
