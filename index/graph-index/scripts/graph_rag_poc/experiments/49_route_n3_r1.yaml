name: 49_route_n3_r1
description: |
  A-1 라우팅 + 구조축 통합 — 1 LLM콜로 질문분류 후 relation→관계요약 / global→커뮤니티요약 / other→없음.
  crude 게이팅 누수(fanout·trap collateral) 해결 시도. 구조축이 라우팅으로 net+ 되나.
  3트랙(50문, temp=0): vector / vplus_critic(채택본) / vplus_critic_route(+라우팅 구조주입).
techniques: [graph_rag, A-3, A-1, relation_summary, community_summary]
gen_temperature: 0
corpus: data/chunks/scaled_1000.json
qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json
  - data/qa/golden_qa_graphtypes.json
categories: null
exclude_ids: [11, 46]
tracks:
  vector:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer: {type: pipeline, stages: [{type: relevance_filter, prompt: relevance_strict}, {type: claim_extraction, prompt: claim_strict}, {type: reduce, prompt: system_baseline}]}
  vplus_critic:
    retriever: {type: vector_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer: {type: pipeline, stages: [{type: relevance_filter, prompt: relevance_strict}, {type: claim_extraction, prompt: claim_strict}, {type: reduce, prompt: system_baseline}, {type: critic_gated, prompt: critic_relation}]}
  vplus_critic_route:
    retriever: {type: vector_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer: {type: pipeline, stages: [{type: relevance_filter, prompt: relevance_strict}, {type: claim_extraction, prompt: claim_strict}, {type: route_inject, relation_path: data/graphs/relation_summaries_real.json, community_path: data/graphs/community_summaries_real.json}, {type: reduce, prompt: system_baseline}, {type: critic_gated, prompt: critic_relation}]}
output: results/49_route_n3_r1
