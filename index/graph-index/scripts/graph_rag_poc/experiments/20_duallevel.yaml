name: 20_duallevel
description: |
  기법 R-3 (Dual-Level Retrieval, 비그래프 근사). LLM이 low(엔티티)+high(주제) 키워드 추출 → 각각 회수 → 병합.
  baseline lazy_qt(vector_topk)와 retriever만 차이. 예상: 회수 확장축(R-2 동류) → net 부정~중립. 데이터 완성용.
techniques: [R-3]
gen_temperature: 0

corpus: data/chunks/scaled_1000.json
qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json
categories: null

tracks:
  lazy_qt:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

  dual_level:
    retriever: {type: dual_level, top_k: 20, low_high_k: 8}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

output: results/20_duallevel
