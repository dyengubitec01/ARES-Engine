name: 47_community_inject
description: |
  구조 축 'global 짝' — real 서브그래프 커뮤니티 요약을 sensemaking/global 질문에 주입(게이팅).
  관계요약(pairwise)이 못 도운 sensemaking을 커뮤니티요약(global)이 채우나 측정.
  3트랙(50문, temp=0): vector / vplus_critic(채택본) / vplus_critic_comm(+커뮤니티요약).
techniques: [graph_rag, A-3, community_summary]
gen_temperature: 0
corpus: data/chunks/scaled_1000.json
qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json
  - data/qa/golden_qa_graphtypes.json
categories: null
exclude_ids: [11, 46]
tracks:
  vector:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer: {type: pipeline, stages: [{type: relevance_filter, prompt: relevance_strict}, {type: claim_extraction, prompt: claim_strict}, {type: reduce, prompt: system_baseline}]}
  vplus_critic:
    retriever: {type: vector_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer: {type: pipeline, stages: [{type: relevance_filter, prompt: relevance_strict}, {type: claim_extraction, prompt: claim_strict}, {type: reduce, prompt: system_baseline}, {type: critic_gated, prompt: critic_relation}]}
  vplus_critic_comm:
    retriever: {type: vector_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer: {type: pipeline, stages: [{type: relevance_filter, prompt: relevance_strict}, {type: claim_extraction, prompt: claim_strict}, {type: community_inject, summaries_path: data/graphs/community_summaries_real.json}, {type: reduce, prompt: system_baseline}, {type: critic_gated, prompt: critic_relation}]}
output: results/47_community_inject
