name: 15_routed
description: |
  A-1 Query Routing — critic을 'relation-pair 질문'에만 조건부 적용(critic_gated).
  always-critic이 Q15(영향력 나열)·실도메인 오귀속을 깬 부작용을, 명시 분류로 게이팅해 회수.
  Autonova 1000청크 40문 3트랙: lazy_qt / R-5+always_critic / R-5+gated_critic.
  기대: gated가 Q28(관계트랩) 유지 + Q15(0.8) 회복 → Tier-1 6/8, 부작용 제거.
techniques: [R-5, A-3, A-1]
gen_temperature: 0

corpus: data/chunks/scaled_1000.json

qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json

categories: null

tracks:
  lazy_qt:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}

  multihop_critic:
    retriever: {type: multihop, top_k: 20, hop2_k: 5}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
        - {type: verify, prompt: critic_relation}

  multihop_gated:
    retriever: {type: multihop, top_k: 20, hop2_k: 5}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
        - {type: critic_gated, prompt: critic_relation}

output: results/15_routed
