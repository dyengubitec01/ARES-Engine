name: 44_rettech_batch2
description: |
  step5 batch2 — 검색 확장 기법 + graph 통합 격리. R-2 Hybrid / R-3 Dual / R-6 Multistage (각 ∪ graph).
  5트랙(50문, temp=0): vector / vplus / hybrid+graph / dual+graph / multistage+graph.
techniques: [R-2, R-3, R-6]
gen_temperature: 0
corpus: data/chunks/scaled_1000.json
qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json
  - data/qa/golden_qa_graphtypes.json
categories: null
exclude_ids: [11, 46]
tracks:
  vector:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer: {type: pipeline, stages: [{type: relevance_filter, prompt: relevance_strict}, {type: claim_extraction, prompt: claim_strict}, {type: reduce, prompt: system_baseline}]}
  vplus:
    retriever: {type: vector_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer: {type: pipeline, stages: [{type: relevance_filter, prompt: relevance_strict}, {type: claim_extraction, prompt: claim_strict}, {type: reduce, prompt: system_baseline}]}
  hybrid_g:
    retriever: {type: hybrid_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json, alpha: 0.7}
    synthesizer: {type: pipeline, stages: [{type: relevance_filter, prompt: relevance_strict}, {type: claim_extraction, prompt: claim_strict}, {type: reduce, prompt: system_baseline}]}
  dual_g:
    retriever: {type: dual_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer: {type: pipeline, stages: [{type: relevance_filter, prompt: relevance_strict}, {type: claim_extraction, prompt: claim_strict}, {type: reduce, prompt: system_baseline}]}
  multistage_g:
    retriever: {type: multistage_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json, stage1_k: 30}
    synthesizer: {type: pipeline, stages: [{type: relevance_filter, prompt: relevance_strict}, {type: claim_extraction, prompt: claim_strict}, {type: reduce, prompt: system_baseline}]}
output: results/44_rettech_batch2
