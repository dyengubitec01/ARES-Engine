name: 37_vplus_critic
description: |
  step5 기법① A-3 Critic(gated) — graph_rag(run35 설정) 위에 critic 얹어 유일 발목(hallucination_trap) 공략.
  critic_gated = '두 대상 직접관계' 질문에만 critic 적용(트랩이 바로 그 유형) → 트랩 환각 억제, 비관계 질문 무부작용 기대.
  3트랙(50문, temp=0): vector / vplus(graph baseline) / vplus+critic.
techniques: [graph_rag, A-3]
gen_temperature: 0

corpus: data/chunks/scaled_1000.json

qa:
  - data/qa/golden_qa.json
  - data/qa/golden_qa_fanout.json
  - data/qa/golden_qa_halluc.json
  - data/qa/golden_qa_graphtypes.json

categories: null
exclude_ids: [11, 46]

tracks:
  vector:
    retriever: {type: vector_topk, top_k: 20}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
  vplus:
    retriever: {type: vector_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
  vplus_critic:
    retriever: {type: vector_plus_graph, top_k: 20, graph: data/graphs/gliner2/lazy_community_1000.json}
    synthesizer:
      type: pipeline
      stages:
        - {type: relevance_filter, prompt: relevance_strict}
        - {type: claim_extraction, prompt: claim_strict}
        - {type: reduce, prompt: system_baseline}
        - {type: critic_gated, prompt: critic_relation}

output: results/37_vplus_critic
