version: '3.8'

services:
  frontend-dev:
    image: registry.example.com/ares/frontend:dev
    container_name: frontend-react-dev
    ports:
      - "8443:80"
    restart: always
    depends_on:
      - alloy

  alloy:
    image: grafana/alloy:v1.6.0
    container_name: frontend-alloy-dev
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    environment:
      LOKI_URL: ${LOKI_URL}
      APP_ENV: dev
      APP_HOST: dev-server
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    restart: always