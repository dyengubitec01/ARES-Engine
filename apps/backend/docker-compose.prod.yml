version: '3.8'

services:
  backend:
    image: registry.example.com/ares/backend:latest
    container_name: backend-nest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Seoul
    env_file:
      - .env.production
    volumes:
      - ./logs:${LOG_DIR:-/var/log/backend}
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  backend-network:
    driver: bridge
