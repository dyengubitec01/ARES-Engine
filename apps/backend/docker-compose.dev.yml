version: '3.8'

services:
  backend:
    image: registry.example.com/ares/backend:dev
    container_name: backend-nest-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - TZ=Asia/Seoul
    env_file:
      - .env.development
    volumes:
      - ./logs-dev:${LOG_DIR:-/var/log/backend}
    networks:
      - backend-dev-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  backend-dev-network:
    driver: bridge
