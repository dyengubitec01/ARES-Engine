events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # API 프록시 → 로컬 NestJS (host.docker.internal = 호스트 PC)
        

        # Backend API 프록시 → 로컬 NestJS (모든 /api/* 요청)
        location /api {
            proxy_pass http://host.docker.internal:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cookie 전달 설정
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;

            # SSE 지원
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
        }

        # MinIO 프록시 → MinIO 서버 (Pre-signed URL용)
        location /minio/ {
            rewrite ^/minio/(.*) /$1 break;

            proxy_pass http://localhost:9000;
            proxy_set_header Host localhost:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 파일 업로드 용량 (100MB)
            client_max_body_size 0;

            # 업로드 타임아웃
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
        }

        # Frontend 프록시 → 프론트엔드 PC (127.0.0.1:5173)
        location / {
            proxy_pass http://127.0.0.1:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 지원 (Vite HMR용)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
