services:
  rag-search:
    image: registry.example.com/ares/rag-search:latest
    container_name: rag-search
    ports:
      - "${PORT:-8006}:8006"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8006 2>&1 | tee -a /app/logs/app.log"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
