services:
  tools-rest-api:
    image: registry.example.com/ares/tools-rest-api:latest
    container_name: tools-rest-api
    ports:
      - "8007:8007"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    command: ["sh", "-c", "uvicorn src.main:app --host 0.0.0.0 --port 8007 2>&1 | tee -a /app/logs/app.log"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
