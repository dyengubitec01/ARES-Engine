# TOL LLM Model Configuration
# Role-Based 모델 매핑 - 코드에서는 역할(role)로만 호출

# 역할 정의
# - primary: 기본 모델 (품질 우선)
# - fast: 빠른 응답용 모델 (속도 우선)
# - reasoning: 복잡한 추론용 모델

roles:
  primary:
    model: "chat-gpt-oss-20b"
    description: "기본 모델 - 품질과 속도의 균형"
    fallback_role: "fast"

  fast:
    model: "chat-gpt-oss-20b"
    description: "빠른 응답용 모델"
    fallback_role: null

  reasoning:
    model: "chat-gpt-oss-20b"
    description: "복잡한 추론이 필요한 작업용"
    fallback_role: "primary"

# 기본 역할 (명시하지 않을 때 사용)
default_role: "primary"

# Graceful Degradation 메시지
fallback_message: "현재 AI 서비스를 이용할 수 없습니다. 잠시 후 다시 시도해주세요."
