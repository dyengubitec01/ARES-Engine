# TOL Prompt Templates
# 시스템 프롬프트 템플릿 및 파라미터 관리

# 요약 프롬프트
summary:
  system: "다음 대화에서 논의된 핵심 정보만 추출하여 약 {target_n_tokens} 토큰 이내로 요약하세요. 누가 말했는지는 언급하지 말고, 내용 자체만 간결하게 정리하세요."
  target_n_tokens: 300

# 핵심 추출 프롬프트
key_extraction:
  system: "다음 텍스트에서 핵심 키워드와 주요 포인트를 {target_n_tokens} 토큰 이내로 추출하세요."
  target_n_tokens: 200
