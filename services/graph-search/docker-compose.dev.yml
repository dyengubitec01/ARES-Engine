services:
  rag-graph-search:
    image: registry.example.com/ares/rag-graph-search:dev-latest
    container_name: rag-graph-search-dev
    ports:
      - "${PORT:-8508}:8007"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8007 2>&1 | tee -a /app/logs/app.log"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8007/health').getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
